<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fukan explorer</title>
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --ink: #1d1c1a; --muted: #6d6a63; --line: #d9d6cd;
    --box: #ffffff; --box-open: #efede6; --accent: #2f5fd0; --warn: #a4430f;
    --code-str: #2d6a3e; --code-kw: #7a3e9d; --code-head: #2f5fd0;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181a; --panel: #1f2023; --ink: #e9e7e1; --muted: #9a978f; --line: #35363a;
      --box: #26272b; --box-open: #1c1d20; --accent: #8fb0ff; --warn: #f0a070;
      --code-str: #9fce9f; --code-kw: #cda4e8; --code-head: #8fb0ff;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 13px/1.45 var(--sans);
         display: grid; grid-template-rows: auto 1fr; grid-template-columns: 1fr 380px; }
  header { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px;
           padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--line); }
  body.embedded header h1 { display: none; }
  header h1 { font-size: 13px; font-weight: 650; margin: 0 6px 0 0; letter-spacing: .02em; }
  details.pick { position: relative; }
  details.pick > summary { list-style: none; cursor: pointer; padding: 4px 10px; border: 1px solid var(--line);
                           border-radius: 6px; background: var(--box); user-select: none; }
  details.pick > summary::-webkit-details-marker { display: none; }
  details.pick > summary b { font-weight: 600; }
  details.pick > summary span { color: var(--muted); }
  details.pick[open] > summary { border-color: var(--accent); }
  .menu { position: absolute; z-index: 5; top: calc(100% + 4px); left: 0; min-width: 240px; max-height: 60vh;
          overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
          padding: 6px; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
  .menu label { display: flex; align-items: center; gap: 8px; padding: 3px 6px; border-radius: 4px; cursor: pointer; }
  .menu label:hover { background: var(--box-open); }
  .menu label small { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
  .menu .sep { margin: 6px 6px 2px; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  input#select { flex: 1 1 220px; min-width: 160px; padding: 4px 8px; font: 12px var(--mono); color: var(--ink);
                 background: var(--box); border: 1px solid var(--line); border-radius: 6px; }
  input#select:focus { outline: none; border-color: var(--accent); }
  select#plane { padding: 3px 6px; font: inherit; color: var(--ink); background: var(--box);
                 border: 1px solid var(--line); border-radius: 6px; }
  select#plane[hidden] { display: none; }
  button { font: inherit; color: var(--ink); background: var(--box); border: 1px solid var(--line);
           border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  #at { color: var(--muted); font-variant-numeric: tabular-nums; }
  main { position: relative; overflow: hidden; min-width: 0; }
  #canvas { position: absolute; inset: 0; overflow: hidden; cursor: grab; touch-action: none; }
  #canvas.dragging { cursor: grabbing; }
  #viewport { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #viewport svg { display: block; user-select: none; }
  /* What a viewer may act on, and nothing about how it is painted: the drawing carries its own
     paint, the selected box's outline included. */
  #viewport g.box { cursor: pointer; }
  #viewport [data-role="toggle"] { pointer-events: all; }
  #notice { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
            padding: 32px; text-align: center; color: var(--muted); pointer-events: none; }
  #notice.on { display: flex; }
  #notice.bad { color: var(--warn); }
  #notice div { max-width: 520px; white-space: pre-wrap; }
  #crumbs { position: absolute; left: 12px; top: 10px; max-width: calc(100% - 24px); display: none;
            padding: 4px 10px; font-size: 12px; background: var(--box); border: 1px solid var(--line);
            border-radius: 6px; }
  #crumbs.on { display: block; }
  #crumbs a { color: var(--accent); cursor: pointer; text-decoration: none; }
  #crumbs a:hover { text-decoration: underline; }
  #unplaced { position: absolute; left: 12px; top: 10px; max-width: calc(100% - 24px); display: none;
              padding: 5px 10px; font-size: 12px; color: var(--ink); background: var(--box);
              border: 1px solid var(--warn); border-radius: 6px; }
  #unplaced.on { display: block; }
  #unplaced b { color: var(--warn); }
  #unplaced button { margin-left: 8px; padding: 1px 8px; font-size: 12px; }
  aside { border-left: 1px solid var(--line); background: var(--panel); overflow: auto; padding: 14px; min-width: 0; }
  aside h2 { font-size: 15px; margin: 0 0 2px; word-break: break-word; }
  aside .sort { color: var(--muted); font: 12px var(--mono); word-break: break-all; }
  aside .path { color: var(--muted); font-size: 12px; margin: 8px 0; word-break: break-word; }
  aside pre .str { color: var(--code-str); }
  aside pre .kw { color: var(--code-kw); }
  aside pre .head { color: var(--code-head); font-weight: 600; }
  aside pre .punct, aside pre .comment { color: var(--muted); }
  aside pre { font: 12px/1.5 var(--mono); white-space: pre-wrap; word-break: break-word; margin: 12px 0 0;
              padding: 10px 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; }
  aside .empty { color: var(--muted); }
  @media (max-width: 820px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto 1fr 40vh; }
    aside { border-left: none; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<header>
  <h1 id="title">fukan · declared design</h1>
  <select id="plane" hidden aria-label="What to draw: the declared design, or one plane the model holds"></select>
  <details class="pick" id="pick-nest"><summary><b>Nest by</b> <span id="nest-sum">—</span></summary><div class="menu" id="nest-menu"></div></details>
  <details class="pick" id="pick-link"><summary><b>Edges</b> <span id="link-sum">—</span></summary><div class="menu" id="link-menu"></div></details>
  <input id="select" spellcheck="false" placeholder='narrow, e.g. [[?n :entity/name "…"]] — Enter to apply' aria-label="Selection, EDN clauses binding ?n">
  <button id="collapse" title="Close every opened box">Collapse all</button>
  <button id="reload" title="Ask again for this address">Reload</button>
  <span id="at"></span>
</header>
<main>
  <div id="canvas" role="img" aria-label="The chosen view as a nested graph"><div id="viewport"></div></div>
  <div id="notice"><div></div></div>
  <nav id="crumbs" aria-label="Where this view is rooted"></nav>
  <div id="unplaced" role="status"></div>
</main>
<aside id="detail"><p class="empty">Select a box to read its declaration. Click its marker to open or close it; double-click it to dive in.</p></aside>
<script src="explorer.js"></script>
</body>
</html>
